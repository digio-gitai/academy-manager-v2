# ⚠️ 이 파일은 academy_dev 폴더에 임시로 만들어둔 것입니다.
# 실제로 동작하게 하려면 git 저장소의 맨 위(루트) 폴더 —
#   G:/app 개발/Academy-Manager/Academy-Manager/streamlit-app  (확인 완료, 2026-08-11)
# 기준으로 아래 경로에 이 내용을 옮겨 넣어야 합니다:
#   .github/workflows/hw_nightly_sms.yml
# (GitHub Actions는 이 정확한 위치의 파일만 인식합니다.)
#
# 저장소 루트가 streamlit-app 폴더 자체이고 academy_dev가 그 바로 아래
# 있는 걸 확인했으므로, working-directory는 "academy_dev"로 이미
# 맞춰뒀습니다(더 안 고치셔도 됩니다).

name: 과제 인증 야간 자동 SMS 발송

on:
  schedule:
    # GitHub Actions의 cron은 항상 UTC 기준입니다.
    # 한국시간(KST) 밤 10:00 = UTC 13:00 (같은 날짜, 시차 9시간)
    - cron: "0 13 * * *"
  workflow_dispatch:
    # 수동으로도 실행해볼 수 있게 버튼 추가(테스트용) —
    # GitHub 저장소 > Actions 탭 > 이 워크플로 선택 > "Run workflow"

jobs:
  send-sms:
    runs-on: ubuntu-latest
    # 스크립트 안에서 date.today() 등이 한국 날짜 기준으로 계산되도록
    # 타임존을 명시적으로 고정합니다(안 하면 서버가 UTC로 계산해서
    # 날짜 경계에서 하루 어긋날 수 있음).
    env:
      TZ: Asia/Seoul
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        working-directory: academy_dev
        run: pip install -r requirements-sms.txt

      - name: 야간 발송 스크립트 실행
        working-directory: academy_dev
        env:
          DATABASE_URL: ${{ secrets.HW_SMS_DATABASE_URL }}
          SOLAPI_API_KEY: ${{ secrets.HW_SMS_SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.HW_SMS_SOLAPI_API_SECRET }}
          SOLAPI_SENDER: ${{ secrets.HW_SMS_SOLAPI_SENDER }}
        run: python send_hw_nightly_sms.py
