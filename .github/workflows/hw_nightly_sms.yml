# [2026-08-29 수정] 예전엔 이 워크플로가 academy_dev(개발용) 폴더의 옛
# 스크립트를 실행하도록 되어 있었습니다 — abc 과제 인증 기능이
# 2026-08-15에 운영(저장소 루트)에 이미 반영됐는데 이 파일만 안 바뀌어서
# 생긴 문제였습니다. 이제는 저장소 루트(운영 폴더)의 최신 스크립트를
# 그대로 실행합니다 — working-directory를 따로 지정하지 않으면
# actions/checkout이 체크아웃한 저장소 맨 위 폴더 기준으로 실행됩니다.

name: 과제 인증 야간 자동 SMS 발송

on:
  schedule:
    # GitHub Actions의 cron은 항상 UTC 기준입니다.
    # 한국시간(KST) 밤 10:00 = UTC 13:00 (같은 날짜, 시차 9시간)
    - cron: "0 13 * * *"
  workflow_dispatch:
    # 수동으로도 실행해볼 수 있게 버튼 추가(테스트용) —
    # GitHub 저장소 > Actions 탭 > 이 워크플로 선택 > "Run workflow"

jobs:
  send-sms:
    runs-on: ubuntu-latest
    # 스크립트 안에서 date.today() 등이 한국 날짜 기준으로 계산되도록
    # 타임존을 명시적으로 고정합니다(안 하면 서버가 UTC로 계산해서
    # 날짜 경계에서 하루 어긋날 수 있음).
    env:
      TZ: Asia/Seoul
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install -r requirements-sms.txt

      - name: 야간 발송 스크립트 실행
        env:
          DATABASE_URL: ${{ secrets.HW_SMS_DATABASE_URL }}
          SOLAPI_API_KEY: ${{ secrets.HW_SMS_SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.HW_SMS_SOLAPI_API_SECRET }}
          SOLAPI_SENDER: ${{ secrets.HW_SMS_SOLAPI_SENDER }}
        run: python send_hw_nightly_sms.py
